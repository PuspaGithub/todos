<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
</head>
<body>
   
   <div class="app">
      <!-- SIDEBAR: All Projects -->
      <aside class="sidebar">
         <h1 class="logo">Todo</h1>

         <nav>
            <h2 class="sidebar-heading">Projects</h2>
            <!-- Js renders one <li> per project. Add .active to the selected one. -->
            <ul class="project-list" id="project-list">
               <!-- Projects created by the user goes here -->
            </ul>
         </nav>   

         <button class="btn btn-ghost" id="new-project-btn">+ New Project</button>
      </aside>

      <!-- MAIN: Todos in the selected project -->
      <main class="main" id="main">

      </main>
   </div>

</body>
</html>
